# Included in every location that sets its own add_header (nginx drops inherited headers otherwise).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'self' blob:; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
# Enable once served over HTTPS:
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
